plugins { id 'java' }

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:26.3.build.256-stable"
    compileOnly 'net.luckperms:api:5.5'
    compileOnly project(':')
    compileOnly files('../libs/JailReloaded-1.2.2.jar')
    compileOnly files('../libs/CoreProtect-25.1.jar')
}

// Live driver only: the real server jar (CraftBukkit/NMS) is used to create a connected in-server test player.
def serverDir = findProperty('serverDir') ?: '/tmp/claude-0/run'
if (file("$serverDir/versions/26.3/paper-26.3.jar").exists()) {
    dependencies {
        compileOnly files("$serverDir/versions/26.3/paper-26.3.jar")
        compileOnly fileTree(dir: "$serverDir/libraries", include: '**/*.jar')
    }
}

tasks.withType(JavaCompile).configureEach { options.release = 25 }
jar { archiveBaseName = 'APLiveTest' }
