# ============================================================================
#  AuraPunishments 1.0.0 - messages.yml   (MiniMessage format)
#  Placeholders look like <player>, <reason>. <prefix> inserts the prefix below.
#  Text typed by staff/players is always inserted as plain text, never as formatting.
#  Any key you delete falls back to the built-in default. /ap reload applies changes.
#
#  Note: short validation/refusal sentences produced by the case, custody and punishment
#  engines (for example "You cannot act against a player of equal or higher authority")
#  are fixed in code, so that security-relevant wording cannot be weakened by a config edit.
# ============================================================================
prefix: "<dark_gray>[<gradient:#c084fc:#60a5fa>AuraPunishments</gradient>]</dark_gray> "
error: "<prefix><red><message>"
info: "<prefix><gray><message>"
success: "<prefix><green><message>"

# ---------------------------------------------------------------------------
#  What PLAYERS see when disciplined
# ---------------------------------------------------------------------------
screen:
  ban:
    - "<red><bold>You are banned from Aurehaven"
    - ""
    - "<gray>Reason: <white><reason>"
    - "<gray>Expires: <white><expires>"
    - "<gray>Reference: <white>#<id>"
    - ""
    - "<gray>If you believe this is a mistake, appeal in our Discord."
  ipban:
    - "<red><bold>Your connection is banned from Aurehaven"
    - ""
    - "<gray>Reason: <white><reason>"
    - "<gray>Expires: <white><expires>"
    - "<gray>Reference: <white>#<id>"
    - ""
    - "<gray>If you believe this is a mistake, appeal in our Discord."
  kick:
    - "<red><bold>You were kicked"
    - ""
    - "<gray>Reason: <white><reason>"
  jailed-login: "<red>You are in custody pending a hearing."
mute:
  notice:
    - "<prefix><red>You have been muted."
    - "<prefix><gray>Reason: <white><reason>"
    - "<prefix><gray>Expires: <white><expires>"
  blocked: "<prefix><red>You are muted and cannot do that. <gray>(Expires: <expires>)"
  expired: "<prefix><green>Your mute has expired. Please follow the rules."
warning:
  notice:
    - "<prefix><gold><bold>OFFICIAL WARNING"
    - "<prefix><gray>Reason: <white><reason>"
    - "<prefix><gray>Further breaches may lead to a case against you."
  delivered-later: "<prefix><gold>You received a warning while you were away:"

# ---------------------------------------------------------------------------
#  Staff alerts (shown to players holding aurapunishments.notify.<event>)
# ---------------------------------------------------------------------------
alert:
  case-created: "<prefix><aqua>Case <ref> opened against <white><player> <gray>(<offense>) by <actor>."
  custody-started: "<prefix><gold>Pretrial custody: <white><player> <gray>detained for case <ref> by <actor>. Review by <deadline>."
  custody-released: "<prefix><green>Custody ended: <white><player> <gray>(case <ref>) - <detail>"
  trial-scheduled: "<prefix><light_purple>Trial for case <ref> (<player>) scheduled: <detail>"
  verdict: "<prefix><yellow>Verdict in case <ref> (<player>): <white><detail>"
  sentence: "<prefix><red>Sentence in case <ref> (<player>): <white><detail>"
  direct-punishment: "<prefix><dark_red>DIRECT PUNISHMENT <white><player> <gray>- <detail> <gray>(case <ref>, by <actor>)"
  emergency: "<prefix><red><bold>EMERGENCY ACTION <white><player> <gray>- <detail> <gray>(case <ref>, by <actor>). Senior review required."
  appeal: "<prefix><aqua>Appeal on case <ref> (<player>): <white><detail>"
  reversal: "<prefix><gray>Reversal on case <ref> (<player>): <white><detail>"
  custody-alert: "<prefix><gold><bold>CUSTODY ALERT <white><player> <gray>(case <ref>): <detail>"

# ---------------------------------------------------------------------------
#  Chat prompts (reason / evidence / note entry)
# ---------------------------------------------------------------------------
prompt:
  header: "<prefix><yellow>Type your answer in chat. Type <white><cancel></white> to abort. <gray>(<seconds>s)"
  cancelled: "<prefix><gray>Cancelled."
  timeout: "<prefix><gray>Timed out - nothing was changed."
  too-short: "<prefix><red>Too short - at least <min> characters are needed."
  too-long: "<prefix><red>Too long - at most <max> characters."
  invalid: "<prefix><red><message>"
  title: "<yellow>Type in chat"
  subtitle: "<gray>or type <cancel> to abort"

# ---------------------------------------------------------------------------
#  Commands
# ---------------------------------------------------------------------------
command:
  no-permission: "<prefix><red>You do not have permission to do that."
  players-only: "<prefix><red>This must be run in-game."
  usage-punish: "<prefix><gray>Usage: <white>/punish <player>"
  unknown-subcommand: "<prefix><red>Unknown subcommand. Use <white>/ap help<red>."
  help-header: "<prefix><gradient:#c084fc:#60a5fa>AuraPunishments help</gradient> <gray>(only commands you can use)"
  help-line: "<gray> <white><usage> <dark_gray>- <gray><description>"
  reload-ok: "<prefix><green>Configuration reloaded and validated."
  reload-failed: "<prefix><red>Reload failed - the previous settings stay active:"
  reload-problem: "<prefix><red> - <problem>"
  opening: "<prefix><gray>Loading <white><player><gray>..."
  busy: "<prefix><gray>Still working on your previous action..."
