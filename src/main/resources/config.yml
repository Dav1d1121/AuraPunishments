# ============================================================================
#  AuraPunishments 1.3.0 - config.yml
#  Edit, then run /ap reload. A reload is validated first: if anything below is
#  invalid the OLD settings stay active and the problems are listed in chat/console.
#
#  Settings marked [RESTART] are read once at startup and need a server restart.
#  Durations use: s, m, h, d, w, mo (30d), y  - e.g. 30m, 1h30m, 2d, 1w.
#  Durations can also be the word "permanent" where noted.
# ============================================================================

# ---------------------------------------------------------------------------
#  General
# ---------------------------------------------------------------------------
general:
  # Extra console logging for troubleshooting. Never logs IP addresses.
  debug: false
  # Staff members only ever see GUI actions they may use? true = locked actions are hidden,
  # false = locked actions are shown greyed-out with the reason.
  hide-locked-actions: false

# ---------------------------------------------------------------------------
#  Network identity  [RESTART]
#  Give every server that runs AuraPunishments its own short name (smp, towny, skyblock, lobby...).
#  The name is stamped on every record the server creates, so records stay identifiable when servers
#  are joined into one network later. Choose it once and keep it. Blank = a random id is generated
#  and remembered (srv-1a2b3c4d), which is fine for a single server.
# ---------------------------------------------------------------------------
network:
  server-name: ""

# ---------------------------------------------------------------------------
#  Database  [RESTART]
# ---------------------------------------------------------------------------
database:
  # Only "sqlite" is implemented in 1.0.0. The schema and data layer are written so a
  # MySQL/MariaDB dialect can be added later without changing the services.
  type: sqlite
  # File inside plugins/AuraPunishments/
  file: punishments.db
  # How long a database operation may take before the staff member is told it failed.
  timeout-seconds: 15

# ---------------------------------------------------------------------------
#  GUI behaviour
# ---------------------------------------------------------------------------
gui:
  # Minimum time between two clicks from the same player (duplicate-click protection).
  click-cooldown-ms: 250
  # How long a chat prompt (reason, evidence, notes) waits for the staff member to type.
  prompt-timeout-seconds: 90
  # (No longer used: text entry is a dialog window with Cancel and Submit buttons; kept so old config files still load.)
  prompt-cancel-word: cancel
  # Rows per list page are fixed by the GUI layout (28 entries per page).
  # Sounds used for feedback. Use a valid Minecraft sound key or "none".
  sounds:
    click: ui.button.click
    success: entity.experience_orb.pickup
    error: entity.villager.no

# ---------------------------------------------------------------------------
#  Cases
# ---------------------------------------------------------------------------
cases:
  # Text length rules for case descriptions, reasons and notes.
  min-description-length: 10
  max-description-length: 400
  min-reason-length: 5
  max-reason-length: 250
  max-note-length: 400
  # Evidence is required when a case is created? Offense-specific minimums in
  # offenses.yml are always enforced in addition to this.
  require-evidence-on-create: false
  # Stop a flood of duplicate cases: a second open case for the same player and offense
  # within this window is refused (the staff member is shown the existing case instead).
  duplicate-window: 10m
  # Maximum number of active (not voided) evidence items on one case.
  max-evidence-per-case: 40
  # Evidence reference limits.
  max-evidence-reference-length: 512
  min-written-report-length: 30

# ---------------------------------------------------------------------------
#  Pretrial custody (JailReloaded does the actual imprisonment)
# ---------------------------------------------------------------------------
custody:
  # Master switch. When false, pretrial detention is disabled everywhere.
  enabled: true
  # Review deadline for pretrial detention. An unresolved case must not mean
  # indefinite imprisonment.
  review-deadline: 48h
  # In-game and Discord alerts are sent this long BEFORE the deadline (once each).
  alert-before: [12h, 1h]
  # After the deadline passes, the overdue alert repeats at this interval.
  overdue-repeat: 1h
  # What happens when the deadline passes with no decision:
  #   ALERT_THEN_RELEASE - alert staff, then automatically release after grace-period.
  #   ALERT_ONLY         - alert only. A judge must always release manually.
  on-deadline: ALERT_THEN_RELEASE
  # Time after the deadline before an automatic release (ALERT_THEN_RELEASE only).
  grace-period: 12h
  # A judge may extend a custody deadline (with a reason) up to this many times.
  max-extensions: 2
  extension-length: 24h
  # Name of the JailReloaded jail to use. Empty = the jail chosen by JailReloaded's own
  # default-jail setting (jailing default-jail in its config).
  jail-name: ""
  # Cell name inside that jail. Empty = let JailReloaded choose.
  cell-name: ""
  # Mute the prisoner in JailReloaded while held (JailReloaded's own mute flag).
  mute-while-held: false
  # [RESTART] Reconcile AuraPunishments' custody records with JailReloaded this often (seconds).
  reconcile-interval-seconds: 60
  # Block /unjail, /unjailforce and similar JailReloaded commands for prisoners who are
  # held for an open case, unless the sender has aurapunishments.custody.override.
  guard-jail-commands: true
  guarded-jail-commands: [unjail, unjailforce, jail, handcuff, unhandcuff]

# ---------------------------------------------------------------------------
#  Judicial workflow
# ---------------------------------------------------------------------------
judicial:
  # MASTER SWITCH for the whole judicial system: cases, pretrial detention, hearings, verdicts and sentencing.
  #   false (default for new installs) - a punishment is final and enforced the moment staff issue it. There is no
  #     mandatory case, no pretrial detention, no hearing and no sentencing step; those screens, commands, work queues,
  #     scheduled checks and notifications are hidden. Everything else works: /punish, warnings, kicks, mutes, bans,
  #     IP bans, jail, emergency actions, evidence, staff notes, history, revoke, owner review and appeals.
  #   true  (what an upgraded 1.0-1.2 install keeps) - everything behaves exactly as before.
  # If this line is missing the judicial system stays ON (so an upgrade never changes behaviour by itself).
  # Takes effect on /ap reload. See docs/JUDICIAL-MODE.md before turning it OFF on a server that has open cases or detainees:
  # nothing is ever released, deleted or resolved automatically - you are warned and finish the open items first.
  enabled: false
  # May the staff member who opened a case also be its judge? The owner is the only
  # judge at launch, so this defaults to true.
  prosecutor-may-judge: true
  # When a judge is assigned, only that judge (or a holder of aurapunishments.judicial.verdict.any)
  # may enter the verdict and sentence.
  require-assigned-judge-for-verdict: true
  # Minimum length for a verdict reasoning / dismissal reason.
  min-verdict-reason-length: 10
  # Time-served credit: pretrial detention time is deducted from timed sentences.
  time-served:
    enabled: true
    # 1.0 = every hour in pretrial custody counts as one hour of the sentence.
    rate: 1.0
    # Sentence types that receive the credit.
    applies-to: [JAIL, MUTE, BAN, IPBAN]
    # 1.1.0: which sentence types get the credit AUTOMATICALLY when a sentence is entered. Types that are in
    # applies-to but not here are offered to the judge as an explicit choice ("judicial discretion").
    # Default: jail time is credited automatically; bans and mutes are at the judge's discretion.
    default-credit-for: [JAIL]

# ---------------------------------------------------------------------------
#  Escalation / repeat offenses
# ---------------------------------------------------------------------------
escalation:
  # category = prior GUILTY findings for the same offense category only,
  # all      = prior GUILTY findings of any category.
  scope: category
  # Count previously issued (non-overturned) direct punishments as prior findings.
  count-direct-punishments: true
  # Acquittals, dismissals, overturned verdicts and unproven allegations NEVER count.

# ---------------------------------------------------------------------------
#  Direct punishments (major offenses only - not the primary workflow)
# ---------------------------------------------------------------------------
direct:
  enabled: true
  # The charged severity must be at least this to qualify.
  minimum-severity: MAJOR
  min-description-length: 30
  # Why the ordinary judicial process is being bypassed. Mandatory.
  min-justification-length: 30
  # Evidence items required (each offense may require more in offenses.yml).
  min-evidence: 1
  # For these punishment types the confirmation also asks for the player's name (extra safety). [] = only Confirm / Cancel
  # (default since 1.2.1). Example to turn it back on: [BAN, IPBAN]. Takes effect on /ap reload.
  type-name-to-confirm: []

# ---------------------------------------------------------------------------
#  Emergency protective actions (separately authorised, auto-expiring)
# ---------------------------------------------------------------------------
emergency:
  enabled: true
  # Types that may be used as an emergency action. Jail is not available here: use
  # pretrial custody through a case.
  allowed-types: [MUTE, BAN]
  default-duration: 6h
  max-duration: 24h
  # Senior staff must review the action within this time or the alerts escalate.
  review-deadline: 12h
  # Repeat the "review overdue" alert this often.
  overdue-repeat: 1h

# ---------------------------------------------------------------------------
#  Punishments: duration limits and evidence requirements
# ---------------------------------------------------------------------------
punishments:
  # Evidence required to issue a QUICK punishment (outside a case / direct pathway).
  # Cases, direct punishments and emergency actions have their own rules above.
  # Jail as an ordinary punishment (needs JailReloaded; used when judicial.enabled is false).
  jail:
    # Jail and cell to use. Blank = custody.jail-name / custody.cell-name (and then JailReloaded's own default).
    jail-name: ""
    cell-name: ""
    # Mute the prisoner in JailReloaded while jailed.
    mute-while-jailed: false
  quick:
    require-reason: true
    require-evidence: [IPBAN, BAN]
    # Permanent quick punishments additionally need the ".permanent" permission node.
    # true  = bans, IP bans and permanent punishments ask the staff member to enter the player's name in a dialog before they apply.
    # false = only the normal Confirm / Cancel screen (default since 1.2.1). Takes effect on /ap reload.
    type-name-to-confirm: false
  # Staff can only issue a TIMED punishment up to the longest tier they hold:
  #   aurapunishments.limit.<type>.<tier>
  # e.g. a Jr Mod with aurapunishments.limit.mute.short may mute for up to 1h.
  # Permanent punishments use aurapunishments.punish.<type>.permanent instead.
  limits:
    mute:
      short: 1h
      medium: 1d
      long: 7d
      extended: 30d
    ban:
      short: 1d
      medium: 7d
      long: 30d
      extended: 180d
    ipban:
      short: 1d
      medium: 7d
      long: 30d
    jail:
      short: 1h
      medium: 6h
      long: 1d
      extended: 7d
  # Warnings are delivered at next login if the player is offline.
  warning-delivery: true
  # Delay (ticks) before a kicked/banned player is disconnected, so the message is shown.
  # 0 disconnects immediately.
  kick-delay-ticks: 0

# ---------------------------------------------------------------------------
#  Staff protections
# ---------------------------------------------------------------------------
protections:
  # Strict hierarchy: you may only act against players with a LOWER authority level.
  # Level comes from LuckPerms nodes aurapunishments.level.<number> (highest number wins).
  enforce-hierarchy: true
  # Players can never open or punish themselves.
  block-self-targeting: true
  # Targets holding this node cannot be punished at all (except by the immunity bypass).
  immunity-node: aurapunishments.immune

# ---------------------------------------------------------------------------
#  Mute enforcement
# ---------------------------------------------------------------------------
mute:
  # Commands (without the slash, any namespace prefix ignored) blocked while muted.
  # Covers EssentialsX private messaging and TownyChat channel shortcuts.
  blocked-commands:
    - msg
    - m
    - w
    - pm
    - tell
    - whisper
    - r
    - reply
    - emsg
    - etell
    - ewhisper
    - epm
    - er
    - ereply
    - me
    - action
    - describe
    - g
    - lc
    - tc
    - nc
    - ac
    - ch
    - channel
    - say
  # Commands blocked only for a given first argument, e.g. "mail send".
  blocked-subcommands:
    - "mail send"
    - "mail sendall"
    - "town say"
    - "nation say"
  # Staff can still be muted; muted players may still use staff help commands listed here.
  allowed-commands: [help, rules, ap, punish]

# ---------------------------------------------------------------------------
#  Legacy punishment commands (EssentialsX / vanilla)
# ---------------------------------------------------------------------------
legacy-commands:
  # AuraPunishments is the authority for punishments. When enabled, players who run the
  # listed commands (vanilla, EssentialsX, bukkit: / minecraft: / essentials: forms) are
  # stopped and told to use /punish unless they hold aurapunishments.legacy.bypass.
  # Console is never blocked.
  block: true
  blocked: [ban, ban-ip, banip, tempban, tempbanip, unban, unbanip, pardon, pardon-ip, kick,
            kickall, mute, tempmute, unmute, warn, unwarn, togglejail, setjail, deljail,
            eban, etempban, ekick, emute, eunban, ebanip, eunbanip]
  # NOTE: /jail and /unjail belong to JailReloaded and are not listed here. For prisoners held
  # for an open case they are guarded by custody.guard-jail-commands instead.

# ---------------------------------------------------------------------------
#  Notifications to staff in-game
# ---------------------------------------------------------------------------
notifications:
  # Players with aurapunishments.notify.<event> receive these. Console always logs them.
  case-created: true
  custody-started: true
  custody-alerts: true
  verdicts: true
  direct-punishments: true
  emergency: true
  warnings: true            # 1.1.0: routine warning issued
  quick-punishments: true   # 1.1.0: quick mute/ban/IP ban issued
  reviews: true             # 1.1.0: owner-review queue activity (see also review.* below)
  admin: true               # 1.1.0: configuration / integration / security notices

# ---------------------------------------------------------------------------
#  1.1.0  Warnings
# ---------------------------------------------------------------------------
warnings:
  notifications:
    # Chat message (always recommended: it stays in the player's chat history).
    chat: { enabled: true }
    title:
      enabled: true
      title: "<red><bold>\u26a0 OFFICIAL WARNING \u26a0"
      subtitle: "<yellow>Please correct your behavior."
      # Show the (truncated) reason in the subtitle instead of the generic line.
      show-reason: false
      reason-max-chars: 40
      subtitle-with-reason: "<yellow><reason>"
      fade-in-ticks: 10
      stay-ticks: 100
      fade-out-ticks: 20
    sound:
      enabled: true
      sound: "block.note_block.pling"   # any vanilla sound key
      volume: 0.8
      pitch: 1.0
      source: master
    actionbar:
      enabled: false
      text: "<red>\u26a0 You received an official warning - see chat"
    # Several queued warnings are shown one after another with this gap (ticks) so none is overwritten.
    spacing-ticks: 120
    # Do not replace the title of a player who is in the middle of a chat prompt; the chat copy is still sent.
    defer-title-while-prompting: true
  # Repeat-warning indicator. NEVER triggers an automatic jail, mute or ban: it only informs staff.
  repeat:
    enabled: true
    window: 30d
    threshold: 3
    same-category-only: false
    recommend-case: true

# ---------------------------------------------------------------------------
#  1.1.0  Owner review of quick punishments
#  Quick punishments stay immediate. Substantive ones (below) also create a reviewable record.
#  Routine warnings and kicks never enter the review queue. Nothing is ever reversed automatically
#  because it is still unreviewed; timed punishments still expire normally.
# ---------------------------------------------------------------------------
review:
  enabled: true
  # Which punishment types are automatically submitted for owner review (never WARN or KICK). JAIL is available
  # when the judicial system is off. Review is a QUEUE for oversight, never an approval step: the punishment is
  # already in force and stays in force until the owner upholds, modifies or reverses it.
  required-types: [MUTE, BAN, IPBAN]
  # Types in this list are only reviewed when PERMANENT (a subset of required-types). Example: [MUTE] reviews permanent
  # mutes but not routine temporary ones; [BAN, IPBAN, MUTE] reviews only permanent punishments of those types.
  permanent-only-types: []
  # When the judicial system is off, also submit emergency protective actions to the owner review queue.
  include-emergency: true
  # Quick punishments shorter than this skip review (0s = review every one of the types above).
  min-duration: 0s
  # Issuers at or above this level (0 = nobody) are exempt from review.
  exempt-level: 0
  # How long the issuer has to add supporting evidence, and how long the owner team has to decide (targets, not auto-actions).
  evidence-deadline: 24h
  review-deadline: 72h
  reminder-before: 12h
  reminder-repeat: 12h
  max-evidence-reminders: 6
  notify-in-game: true

# ---------------------------------------------------------------------------
#  1.1.0  Dashboards, defendant communication, exports, CoreProtect
# ---------------------------------------------------------------------------
dashboard:
  # Custody ending within this window counts as "approaching".
  approaching-custody: 12h
  # Higher number = shown first on the judicial work queue.
  priority:
    custody-overdue: 100
    emergency-overdue: 95
    custody-imminent: 90
    emergency-pending: 80
    quick-review-overdue: 75
    appeal: 60
    awaiting-sentencing: 55
    awaiting-verdict: 50
    quick-review-pending: 45
    further-investigation: 40
    awaiting-trial: 30

defendant:
  enabled: true
  hearing-instructions: "Staff will contact you with the Discord hearing details. Please make sure you can be reached on Discord."
  include-reasoning: true
  sound: false
  # Case status changes the defendant is told about (verdict, sentence, release and scheduling are always sent).
  notify-statuses: [IN_TRIAL, DISMISSED, CLOSED, UNDER_INVESTIGATION]

exports:
  enabled: true
  folder: exports            # inside plugins/AuraPunishments/
  include-timeline: true

# ---------------------------------------------------------------------------
#  Discord webhooks (webhooks only: never DMs, never creates channels)
#  Keep webhook URLs out of config.yml if you share it: use "${env:NAME}" or a plugins/AuraPunishments/webhooks.yml
#  (optional; one key per category, or "default"). URLs are never printed to logs, GUIs or Discord.
#  Delivery is queued in the database, so Discord being down never blocks moderation and unsent messages are retried.
# ---------------------------------------------------------------------------
discord:
  enabled: false
  # Default webhook (fallback for every category that has none).
  webhook-url: ""
  username: "AuraPunishments"
  avatar-url: ""
  # One log destination per category. Use several URLs to post the same events to several channels.
  # fallback: another category name, or "default". mention-roles: numeric role ids; pinged only for mention-events.
  channels:
    punishment:       { enabled: true, webhooks: [], fallback: default, mention-roles: [], mention-events: [] }
    judicial:         { enabled: true, webhooks: [], fallback: default, mention-roles: [], mention-events: [] }
    custody:          { enabled: true, webhooks: [], fallback: default, mention-roles: [], mention-events: [custody-alert, custody-failed] }
    owner-review:     { enabled: true, webhooks: [], fallback: default, mention-roles: [], mention-events: [review-created, review-overdue] }
    direct-emergency: { enabled: true, webhooks: [], fallback: default, mention-roles: [], mention-events: [emergency-action] }
    appeal:           { enabled: true, webhooks: [], fallback: default, mention-roles: [], mention-events: [] }
    administrative:   { enabled: true, webhooks: [], fallback: default, mention-roles: [], mention-events: [] }
  # Per-event overrides (all optional): enabled, category (move the event), webhooks (dedicated destinations).
  # Events: case-created case-status custody-attempt custody-started custody-failed custody-released custody-alert
  #         trial-scheduled trial-postponed verdict sentence direct-punishment emergency-action warning quick-punishment
  #         reversal punishment-modified review-created review-decision review-evidence review-reminder review-overdue
  #         appeal appeal-ticket admin-action export integration-error security
  events:
    case-created: { enabled: true }
    custody-started: { enabled: true }
    custody-released: { enabled: true }
    trial-scheduled: { enabled: true }
    verdict: { enabled: true }
    sentence: { enabled: true }
    direct-punishment: { enabled: true }
    emergency-action: { enabled: true }
    appeal: { enabled: true }
    reversal: { enabled: true }
    custody-alert: { enabled: true }
    warning: { enabled: true }
  timeout-seconds: 10
  max-retries: 3
  retry-backoff-seconds: 5
  outbox-retention-days: 14
  # ---- 1.3.0 punishment notifications --------------------------------------------------------------------------
  # PRIVATE staff log: every punishment notice below goes to the "punishment" channel above (or to the webhooks listed
  # here). Delivery is queued, retried and never duplicated; a Discord outage never delays or blocks a punishment.
  punishment-log:
    enabled: true
    webhooks: []            # empty = use channels.punishment routing
    types: [WARN, KICK, MUTE, BAN, IPBAN, JAIL]
    # issued, modified, revoked, expired, appeal (filed/ticket/decision), judicial (cases, verdicts, sentences, custody)
    events: [issued, modified, revoked, expired, appeal, judicial]
    # player, type, reason, duration, expires, issuer, punishment-id, server, evidence, source, network-status, case
    fields: [player, type, reason, duration, expires, issuer, punishment-id, server, evidence, source]
  # OPTIONAL PUBLIC announcements (off by default). Sanitized by design: only player, type, reason, duration, expires
  # and server can ever appear - never the issuing staff member, evidence, notes, addresses or internal ids - and the
  # reason is shown only if show-reason is true. It never uses the private webhooks above: give it its own.
  public-log:
    enabled: false
    webhooks: []
    types: [BAN, IPBAN]
    events: [issued]
    fields: [player, type, duration]
    show-reason: false

# ---------------------------------------------------------------------------
#  Appeals (1.3.0)
#  Appeals are handled in Discord with Ticket Tool. Staff record the appeal against the punishment here and
#  reference the ticket; AuraPunishments never creates, reads or closes Discord tickets. An appeal does not
#  suspend the punishment. Deciding needs aurapunishments.appeal.decide (never granted by default).
# ---------------------------------------------------------------------------
appeals:
  # Require a Ticket Tool ticket reference when an appeal is recorded.
  require-ticket: false
  min-reason-length: 10

# ---------------------------------------------------------------------------
#  Retention
# ---------------------------------------------------------------------------
retention:
  # Audit entries older than this many days are pruned (the hash chain is re-anchored so
  # verification still works). 0 = keep forever (recommended).
  audit-days: 0
  # Cases, evidence, punishments and notes are never deleted automatically.

# ---------------------------------------------------------------------------
#  Integrations
# ---------------------------------------------------------------------------
integrations:
  coreprotect:
    enabled: true
    max-radius: 50
    max-time: 7d
    sample-rows: 8
  # JailReloaded is required for pretrial custody and jail sentences. When it is missing
  # or incompatible, everything else keeps working and custody actions fail safely with a
  # clear message (nothing is faked).
  jailreloaded:
    enabled: true
  luckperms:
    # [RESTART] Subscribe to LuckPerms permission changes so open GUIs close when access is revoked.
    close-guis-on-permission-change: true

# 1.1.0 CoreProtect: READ-ONLY evidence lookups (inspect/lookup only; never rolls anything back, never decides guilt).
